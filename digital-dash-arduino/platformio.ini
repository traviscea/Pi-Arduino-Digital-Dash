[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
; upload_speed = 115200

build_flags = 
; Note: Uncomment the following line to enable CAN bus support
;   -D CAN_ENABLED
lib_deps =
    coryjfowler/mcp_can@^1.5.1